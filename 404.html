<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open in BeatThis</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .code-block {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 28px; letter-spacing: 6px; font-weight: 700;
      color: var(--accent); background: rgba(255,107,91,0.08);
      border: 1px solid var(--accent); padding: 16px 24px;
      border-radius: 12px; display: inline-block; margin-top: 8px;
    }
    .cta-row { display: flex; flex-direction: column; gap: 12px; align-items: center; margin-top: 32px; }
    .cta-row a {
      display: inline-block; padding: 14px 28px; background: var(--accent);
      color: white; border-radius: 999px; font-weight: 700; letter-spacing: 0.3px;
      min-width: 240px; text-align: center; border-bottom: none;
    }
    .cta-row a:hover { background: #E85546; border-bottom: none; }
    .cta-row a.ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
    .cta-row a.ghost:hover { color: white; border-color: white; }
    .small { font-size: 14px; color: var(--text-muted); margin-top: 20px; }
    .join-page { text-align: center; padding-top: 60px; }
  </style>
</head>
<body>
  <div class="container join-page">
    <div class="top-nav" style="justify-content: center;">
      <a href="/" class="brand">BeatThis</a>
    </div>
    <p class="eyebrow" id="eyebrow">Invite</p>
    <h1 id="heading">Open in BeatThis</h1>
    <p class="tagline" id="tagline">A friend invited you on BeatThis.</p>
    <div id="codeBlock" style="display:none;" class="code-block"></div>
    <p class="small" id="codeHint" style="display:none; margin-top:12px;"></p>
    <div class="cta-row">
      <a id="getBtn" href="https://apps.apple.com/app/beatthis-daily-challenges/id6780211717">Get BeatThis</a>
      <a class="ghost" id="openBtn" href="#">Open BeatThis</a>
    </div>
    <p class="small">
      New here? Tap "Get BeatThis" to install, then reopen this link. Already have it? Tap "Open BeatThis".
    </p>
    <div class="footer" style="margin-top: 80px;">
      <p>&copy; 2026 BeatThis. <a href="/">Home</a> &middot; <a href="/privacy">Privacy</a> &middot; <a href="/terms">Terms</a></p>
    </div>
  </div>
  <script>
    (function () {
      var STORE_URL = 'https://apps.apple.com/app/beatthis-daily-challenges/id6780211717';
      // How long to wait for the app to take over before assuming it isn't
      // installed. A cold launch on an older phone can take over a second, and
      // redirecting out from under a launching app is worse than waiting.
      var FALLBACK_MS = 1600;
      var path = window.location.pathname;
      var join = /^\/join\/([A-Z0-9]{6})\/?$/i.exec(path);
      var add  = /^\/add\/([A-Z0-9]{6})\/?$/i.exec(path);
      var m = join || add;
      if (!m) return;
      var code = m[1].toUpperCase();
      var kind = join ? 'join' : 'add';
      if (kind === 'add') {
        // Friends have no manual code entry in-app (add is via this link or
        // name search only), so we do NOT show the code here.
        document.getElementById('eyebrow').textContent = 'Friend invite';
        document.getElementById('heading').textContent = 'Add me on BeatThis';
        document.getElementById('tagline').textContent = 'Open BeatThis from this link and you will be added as friends automatically.';
      } else {
        // Groups support manual "Join by code" in-app, so show the code as a fallback.
        document.getElementById('eyebrow').textContent = 'Group invite';
        document.getElementById('heading').textContent = 'Join the group';
        document.getElementById('tagline').textContent = 'A friend invited you to a daily challenge group on BeatThis.';
        var block = document.getElementById('codeBlock');
        block.textContent = code;
        block.style.display = 'inline-block';
        var hint = document.getElementById('codeHint');
        hint.textContent = 'Already have BeatThis? Open the app, tap Join, and enter this code.';
        hint.style.display = 'block';
      }

      // Copy the invite URL to the clipboard on a CTA tap. A NEW install can't
      // receive the link through the App Store (iOS drops it), but the clipboard
      // survives, so the app reads it on first launch and connects the friend
      // automatically (deferred deep link).
      //
      // IMPORTANT: use a SYNCHRONOUS execCommand copy, not navigator.clipboard
      // (async). On iOS Safari the async write gets aborted when the page
      // navigates to the App Store, so nothing lands on the clipboard. The
      // hidden-textarea + execCommand approach completes within the tap gesture,
      // before navigation.
      function copyInvite() {
        var text = window.location.href;
        try {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '-1000px';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          ta.setSelectionRange(0, text.length);
          document.execCommand('copy');
          document.body.removeChild(ta);
        } catch (e) {}
        // Async API as a secondary attempt where supported.
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text);
          }
        } catch (e) {}
      }
      // "Get BeatThis" is an <a> to the App Store — copy first, then let it
      // navigate a beat later so the sync copy definitely finishes.
      var getBtn = document.getElementById('getBtn');
      if (getBtn) {
        getBtn.addEventListener('click', function (e) {
          e.preventDefault();
          copyInvite();
          var href = getBtn.getAttribute('href');
          setTimeout(function () { window.location.href = href; }, 120);
        });
      }

      // Hand off to the app, falling back to the App Store if nothing takes
      // over.
      //
      // The launch MUST be a top-level navigation. This previously injected a
      // hidden iframe pointing at the custom scheme, the standard trick around
      // 2012, but ignored by iOS Safari since iOS 9 and by every WKWebView
      // in-app browser (WhatsApp, Instagram) since. The iframe did nothing at
      // all: no launch, no error. The page never hid, so the timer below fired
      // for EVERYONE and sent them to the App Store, installed or not. That is
      // the bug where people with the app tapped "Open BeatThis" and landed in
      // the store.
      var deeplink = 'beatthis://' + kind + '/' + code;

      function openAppThenStore() {
        copyInvite();

        var t0 = Date.now();
        var handedOff = false;
        // Deliberately NOT listening for 'blur': the "address invalid" alert
        // shown when the app isn't installed can blur the window without any
        // hand-off having happened, which would cancel the fallback below and
        // strand a new user on a dead page. Only a genuinely hidden document
        // proves another app took the foreground.
        function onHide() { handedOff = true; }
        document.addEventListener('visibilitychange', onHide);
        window.addEventListener('pagehide', onHide);

        setTimeout(function () {
          document.removeEventListener('visibilitychange', onHide);
          window.removeEventListener('pagehide', onHide);
          if (handedOff || document.hidden) return;
          // A timer that fires much later than scheduled means the page was
          // suspended, which only happens when another app took the foreground.
          // Treat that as a successful hand-off rather than bouncing the user to
          // the store the moment they switch back.
          if (Date.now() - t0 > FALLBACK_MS + 800) return;
          window.location = STORE_URL;
        }, FALLBACK_MS);

        window.location.href = deeplink;
      }

      var openBtn = document.getElementById('openBtn');
      openBtn.href = deeplink;
      openBtn.addEventListener('click', function (e) {
        e.preventDefault();
        openAppThenStore();
      });
    })();
  </script>
</body>
</html>
